[package]
name = "tauri-plugin-nero-extensions"
version = "0.1.0"
edition = "2024"
links = "tauri-plugin-nero-extensions"

[build-dependencies]
tauri-plugin = { version = "2.5.1", features = ["build"] }

[dependencies]
anifile = { git = "https://github.com/dacchidocchi/anifile.git", rev = "9d4742d" }
anyhow.workspace = true
async-trait = "0.1.89"
axum = "0.8.6"
libnero = { git = "https://github.com/nero-app/libnero.git", rev = "a7b0302", features = [
    "torrent",
] }
librqbit = "8.1.1"
nero-media-proxy = { git = "https://github.com/nero-app/libnero.git", rev = "a7b0302", features = [
    "torrent-librqbit",
] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", default-features = false }
tauri-plugin-store = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }
uuid = { version = "1.23.1", features = ["v4"] }
