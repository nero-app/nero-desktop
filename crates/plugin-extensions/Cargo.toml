[package]
name = "tauri-plugin-nero-extensions"
version = "0.1.0"
edition = "2024"
links = "tauri-plugin-nero-extensions"

[build-dependencies]
tauri-plugin = { version = "2.5.1", features = ["build"] }

[dependencies]
anyhow.workspace = true
libnero = { git = "https://github.com/nero-app/libnero.git", rev = "95935cc", features = [
    "torrent",
] }
librqbit = "8.1.1"
nero-processor = { git = "https://github.com/nero-app/libnero.git", rev = "95935cc", features = [
    "torrent",
    "torrent-librqbit",
] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", default-features = false }
tracing = { workspace = true }
